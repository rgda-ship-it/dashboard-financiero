# ETL de cripto: el cuello de botella real del coste 0.
#
# CoinGecko en tier gratuito admite del orden de 10-15 peticiones por
# minuto, y cada moneda cuesta DOS llamadas (/market_chart para cierres,
# precio vivo y volumen; /ohlc a 4 h para máximos y mínimos). El conector
# espacia sus llamadas 6 s y respeta `Retry-After` ante un 429.
#
# Con 20 criptos en el catálogo, recorrerlas todas en cada pasada serían
# ~4 minutos de reloj y 2.880 min/mes: POR ENCIMA de los 2.000 del tier
# gratuito. De ahí el `--max 8` y la priorización de `seleccionar_activos`:
#   1. criptos con una posición abierta -> en TODAS las pasadas
#   2. el resto -> rotación por antigüedad de `ultimo_etl_en`
#
# Tope 8 y no 6 (2026-09-29): con 8 criptos seguidas y 6 por pasada, cada
# una se refrescaba cada 1-2 horas, y a las 2 horas su señal pasa de los
# 90 minutos que exigen los agentes. 8 monedas = 16 peticiones espaciadas
# 6 s = 10 por minuto, dentro de lo que tolera CoinGecko sin clave.
#
# Estimado: 720 pasadas/mes × ~90 s = ~1.080 min/mes, más ~240 min de la
# red de seguridad cada 3 h (casi todas terminan al ver los activos frescos).

name: etl-cripto

# QUIÉN LO DISPARA (0015): Supabase, cada hora a los :07, con
# `workflow_dispatch` desde `pg_cron`. El `schedule` de GitHub no es fiable:
# programado cada hora, corría cada 3-7 horas (medido el 2026-09-29). Se
# queda solo como RED DE SEGURIDAD, cada 3 horas y lejos de la hora en
# punto; si corre detrás de un disparo, los activos están frescos y la
# pasada termina sin llamar a CoinGecko.

on:
  schedule:
    - cron: '37 */3 * * *'
  workflow_dispatch:

concurrency:
  group: etl-cripto
  cancel-in-progress: false

jobs:
  escanear:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: motor-analitico/requirements.txt

      - run: pip install -r motor-analitico/requirements.txt

      # Red de seguridad del alta de activos (Sprint 4): si el disparo
      # desde la BD no llegó, lo pendiente se procesa aquí. Sin nada
      # pendiente es una consulta y termina. No bloquea el escaneo.
      - name: Altas pendientes
        working-directory: motor-analitico
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LEVERAGE_HARD_CAP_FASE1: '5'
          VERSION_MOTOR: ${{ github.sha }}
        run: python altas.py

      - name: Escanear y escribir
        working-directory: motor-analitico
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LEVERAGE_HARD_CAP_FASE1: '5'
          VERSION_MOTOR: ${{ github.sha }}
        run: python etl.py --clase cripto --max 8
