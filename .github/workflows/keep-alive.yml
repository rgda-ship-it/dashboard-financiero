# Latido semanal: mantener vivo, respaldar y podar.
#
# Tres trabajos que el tier gratuito de Supabase obliga a hacer a mano:
#
# 1. KEEP-ALIVE. Supabase pausa un proyecto tras ~1 semana de baja
#    actividad. Si el ETL se para —o el proyecto se aparca unos meses—,
#    este latido lo detecta y avisa en vez de que todo se apague en
#    silencio.
#
# 2. RESPALDO. El tier gratuito NO incluye descarga de backups ni
#    recuperación a un punto en el tiempo. Se respaldan las tablas de
#    gobierno y del experimento —las que no se pueden regenerar— como
#    JSON, con 90 días de retención. Las de precios, indicadores y
#    señales quedan fuera a propósito: pesan y se reconstruyen desde los
#    proveedores. Se restauran con `scripts/restaurar_respaldo.py`.
#
# 3. RETENCIÓN. `senales` con histórico completo alcanza ~600 MB en un
#    año y el tier gratuito da 500 MB. Sin esta poda, el sistema funciona
#    seis meses y luego deja de escribir señales sin explicación aparente.
#
# TODO por la API REST con la clave de servicio, no con psql: la conexión
# directa de Supabase solo resuelve por IPv6 y los runners de GitHub son
# IPv4 (`Network is unreachable`). El Session pooler funcionaría, pero
# obligaría a guardar la contraseña de la base de datos en otro secreto.
# Decisión del dueño (2026-09-22): misma vía que el ETL, una credencial
# menos. `SUPABASE_DB_URL` ya no se usa en ningún workflow.
#
# Este workflow también es el canario de los cron programados: GitHub
# desactiva los `schedule` de un repositorio tras 60 días sin actividad.
# Si deja de ejecutarse, es que se han desactivado todos.

name: keep-alive

on:
  schedule:
    - cron: '0 6 * * 1'   # lunes 06:00 UTC
  workflow_dispatch:

jobs:
  latido:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # respaldo.py solo necesita requests; pandas entra porque
      # escritor_supabase importa los traductores de filas del ETL.
      - run: pip install requests pandas

      - name: Latido, respaldo y retención
        working-directory: motor-analitico
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python respaldo.py

      - uses: actions/upload-artifact@v4
        with:
          name: respaldo-${{ github.run_id }}
          path: motor-analitico/respaldo/
          retention-days: 90

  # Copia semanal de /coins/list de CoinGecko (Sprint 4): una sola
  # llamada, y con ella la base de datos valida y resuelve criptos al
  # instante sin gastar cuota.
  catalogo-cripto:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install requests pandas

      - name: Refrescar la copia de /coins/list
        working-directory: motor-analitico
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python catalogo_cripto.py
