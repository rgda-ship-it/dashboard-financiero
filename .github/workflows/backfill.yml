# Backfill bajo demanda de un activo nuevo.
#
# Este workflow es la pieza que hace posible el requisito 3 sin pagar un
# servidor: la Edge Function `resolver-activo` (H-19, Sprint 4) lo dispara
# por la API de GitHub en cuanto un usuario añade un símbolo que el
# catálogo no conocía.
#
#   POST /repos/{owner}/{repo}/actions/workflows/backfill.yml/dispatches
#   { "ref": "master", "inputs": { "simbolo": "NVDA" } }
#
# Latencia percibida por el usuario: el activo aparece AL INSTANTE en su
# cartera con estado «aprovisionando», y se completa en 1-3 minutos sin
# que recargue nada. La espera es visible y tiene nombre, en vez de ser un
# spinner indefinido.

name: backfill

on:
  workflow_dispatch:
    inputs:
      simbolo:
        description: 'Símbolo del catálogo (MAYÚSCULAS si es acción, minúsculas si es cripto)'
        required: true
        type: string

# Agrupado POR SÍMBOLO: dos usuarios añadiendo NVDA a la vez disparan dos
# workflows, y solo uno debe pagar el backfill. El segundo se cancela.
concurrency:
  group: backfill-${{ inputs.simbolo }}
  cancel-in-progress: true

jobs:
  rellenar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: motor-analitico/requirements.txt

      - run: pip install -r motor-analitico/requirements.txt

      - name: Backfill de ${{ inputs.simbolo }}
        working-directory: motor-analitico
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LEVERAGE_HARD_CAP_FASE1: '5'
          VERSION_MOTOR: ${{ github.sha }}
        # --forzar porque un usuario que añade una acción a las 22:00 no
        # debe esperar a la apertura del día siguiente para ver su
        # histórico: el backfill lee 2 años de velas cerradas.
        run: python etl.py --simbolo "${{ inputs.simbolo }}" --forzar
