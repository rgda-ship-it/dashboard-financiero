# Backfill MANUAL de un activo que ya está en el catálogo.
#
# El alta automática de activos nuevos la hace `altas.yml`, que dispara
# la base de datos (Sprint 4). Este workflow queda como herramienta de
# mantenimiento: rehacer el histórico de un símbolo concreto a mano desde
# la pestaña Actions.

name: backfill

on:
  workflow_dispatch:
    inputs:
      simbolo:
        description: 'Símbolo del catálogo (MAYÚSCULAS si es acción, minúsculas si es cripto)'
        required: true
        type: string

# Agrupado POR SÍMBOLO: dos usuarios añadiendo NVDA a la vez disparan dos
# workflows, y solo uno debe pagar el backfill. El segundo se cancela.
concurrency:
  group: backfill-${{ inputs.simbolo }}
  cancel-in-progress: true

jobs:
  rellenar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: motor-analitico/requirements.txt

      - run: pip install -r motor-analitico/requirements.txt

      - name: Backfill de ${{ inputs.simbolo }}
        working-directory: motor-analitico
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          LEVERAGE_HARD_CAP_FASE1: '5'
          VERSION_MOTOR: ${{ github.sha }}
        # --forzar porque un usuario que añade una acción a las 22:00 no
        # debe esperar a la apertura del día siguiente para ver su
        # histórico: el backfill lee 2 años de velas cerradas.
        run: python etl.py --simbolo "${{ inputs.simbolo }}" --forzar
